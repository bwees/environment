%YAML 1.1
---
apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
      
    server: https://eridani:6443
  name: eridani
- cluster:
    certificate-authority-data: 
      
    server: https://grace:6443
  name: hail-mary
- cluster:
    certificate-authority-data: 
      
    server: https://stepien:6443
  name: stepien
- cluster:
    certificate-authority-data: 
      
    server: https://tau-ceti:6443
  name: tau-ceti
contexts:
- context:
    cluster: eridani
    user: eridani
  name: eridani
- context:
    cluster: hail-mary
    user: hail-mary
  name: hail-mary
- context:
    cluster: stepien
    user: stepien
  name: stepien
- context:
    cluster: tau-ceti
    user: tau-ceti
  name: tau-ceti
kind: Config
users:
- name: eridani
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      args:
      - k8s-eridani
      command: /run/current-system/sw/bin/kube-op-cred
      interactiveMode: IfAvailable
      provideClusterInfo: false
- name: hail-mary
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      args:
      - k8s-hail-mary
      command: /run/current-system/sw/bin/kube-op-cred
      interactiveMode: IfAvailable
      provideClusterInfo: false
- name: stepien
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      args:
      - k8s-stepien
      command: /run/current-system/sw/bin/kube-op-cred
      interactiveMode: IfAvailable
      provideClusterInfo: false
- name: tau-ceti
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      args:
      - k8s-tau-ceti
      command: /run/current-system/sw/bin/kube-op-cred
      interactiveMode: IfAvailable
      provideClusterInfo: false

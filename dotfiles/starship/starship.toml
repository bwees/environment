format = "$os$username$hostname$directory$git_branch$git_commit$git_status$c$golang$haskell$java$julia$nodejs$nim$rust$scala$dotnet$docker_context$character"

[c]
symbol = " "

[directory]
format = "[$path ]($style)"
read_only = " "
truncation_length = 3
truncation_symbol = ".../"

[docker_context]
symbol = " "

[fill]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "

[git_commit]
commit_hash_length = 4
tag_symbol = "🔖 "

[git_status]
format = "[$all_status$ahead_behind ]($style)"

[golang]
symbol = " "

[haskell]
symbol = " "

[hostname]
format = "[$ssh_symbol$hostname ]($style)"

[java]
symbol = " "

[julia]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = " "

[meson]
symbol = "喝 "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
symbol = " "

